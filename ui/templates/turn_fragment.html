<div id="turn">
  <div class="thread">
    {%- for m in conv.messages %}
    {%- if m.role == "agent" %}
    <div class="msg msg-agent">{{ m.content | markdown | safe }}</div>
    {%- else %}
    <div class="msg msg-user">{{ m.content }}</div>
    {%- endif %}
    {%- endfor %}
  </div>

  {% include "turn_tail.html" %}
</div>
