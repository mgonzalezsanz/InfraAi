{% extends "layout.html" %}

{% block main %}
<div class="card">
  <h1>New conversation</h1>
  <p class="subtitle">Describe an infrastructure change, or ask a question about the target repo.</p>

  <form method="post" action="/runs">
    <textarea name="user_request" placeholder="e.g. Add versioning to the app_data S3 bucket" required></textarea>
    <button type="submit">Run</button>
  </form>
</div>
{% endblock %}
