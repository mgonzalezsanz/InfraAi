name: Terraform

# Only ever runs on merge to main — never on PRs, forks, or other branches.
on:
  push:
    branches: [main]

permissions:
  id-token: write   # OIDC — no static AWS keys stored anywhere
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false   # never interrupt an apply that's already running

env:
  TF_IN_AUTOMATION: "true"

jobs:
  # -------------------------------------------------------------------------
  # plan — runs automatically. Read-only role, no gate. Publishes the plan so
  # a reviewer can read it before approving the apply job below.
  # -------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"   # pinned: a saved plan only applies with the same build

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Checkov (policy scan — reported, not blocking)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          quiet: true

      - name: Configure AWS credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.INFRAI_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init -input=false
      - run: terraform validate -no-color
      - run: terraform plan -input=false -lock=false -out=tfplan -no-color

      - name: Plan summary
        run: terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 5

  # -------------------------------------------------------------------------
  # apply — needs the plan job, and is gated by the `production` Environment
  # (required reviewer + deployment-branch rule = main only). Applies exactly
  # the plan the reviewer saw; fails safely if state moved in between.
  # -------------------------------------------------------------------------
  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.INFRAI_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init -input=false
      - run: terraform apply -input=false tfplan
