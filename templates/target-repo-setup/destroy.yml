name: Terraform Destroy

# Manually dispatched only. Type "destroy" in the input to confirm — that typed
# word is the gate. Tears down everything Terraform manages in this repo.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to tear down all managed infrastructure'
        required: true
        type: string

permissions:
  id-token: write   # OIDC — no static AWS keys anywhere
  contents: read

concurrency:
  group: terraform-${{ github.ref }}   # shared with plan.yml / apply.yml so runs never overlap
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: production   # same OIDC sub scoping + main-only rule as apply.yml
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}   # via env, never inline ${{ }}, to avoid script injection
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error::You must type exactly 'destroy' to confirm (got: '$CONFIRM')."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.INFRAI_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init -input=false

      - name: Destroy plan
        run: terraform plan -destroy -input=false -no-color -out=tfdestroy

      - name: What will be destroyed
        run: terraform show -no-color tfdestroy >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the destroy
        run: terraform apply -input=false tfdestroy
